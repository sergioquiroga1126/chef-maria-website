<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Chef Maria AI</title>

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #f7f1ea;
      color: #2b1b12;
    }

    .chat-page {
      max-width: 850px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .chat-card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      color: #8b1e1e;
    }

    #messages {
      min-height: 320px;
      max-height: 520px;
      overflow-y: auto;
      border: 1px solid #e2d7cc;
      border-radius: 14px;
      padding: 16px;
      background: #fffaf5;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: #8b1e1e;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bot {
      align-self: flex-start;
      background: white;
      border: 1px solid #eadfd5;
      border-bottom-left-radius: 5px;
    }

    .speaker {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 999px;
      border: 1px solid #d8c8b8;
      font-size: 16px;
    }

    button {
      padding: 14px 22px;
      border: none;
      border-radius: 999px;
      background: #8b1e1e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    a {
      color: #8b1e1e;
    }
  </style>
</head>

<body>
  <div class="chat-page">
    <p><a href="/">← Back to Chef Maria</a></p>

    <div class="chat-card">
      <h1>Ask Chef Maria AI</h1>

      <p>
        Ask about private dinners, catering, menus, cooking classes, dietary needs,
        service areas, and event ideas.
      </p>

      <div id="messages">
        <div class="msg bot">
          <strong>Chef Maria AI:</strong> Ciao! How can I help you plan your Italian private dining experience?
        </div>
      </div>

      <div class="input-row">
        <input id="question" placeholder="Ask Chef Maria AI..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let chatHistory = [];
    let sending = false;

    function cleanBotText(text) {
      return String(text || "")
        .replace(/\\\*\\\*/g, "")
        .replace(/\*\*/g, "")
        .replace(/\\@/g, "@")
        .trim();
    }

    function addMessage(role, text, id = "") {
      const messages = document.getElementById("messages");

      const box = document.createElement("div");
      box.className = `msg ${role}`;
      if (id) box.id = id;

      const speaker = document.createElement("span");
      speaker.className = "speaker";
      speaker.textContent =
        role === "user" ? "You" : "Chef Maria AI";

      const content = document.createElement("span");
      content.textContent =
        role === "bot" ? cleanBotText(text) : text;

      box.appendChild(speaker);
      box.appendChild(content);
      messages.appendChild(box);

      messages.scrollTop = messages.scrollHeight;
      return box;
    }

    async function sendMessage() {
      if (sending) return;

      const input = document.getElementById("question");
      const button = document.querySelector(".input-row button");
      const question = input.value.trim();

      if (!question) return;

      sending = true;
      button.disabled = true;
      input.disabled = true;

      addMessage("user", question);
      input.value = "";

      const thinking = addMessage(
        "bot",
        "Thinking...",
        "thinking"
      );

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: question,
            history: chatHistory
          })
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();

        thinking.remove();
        addMessage("bot", data.answer);

        chatHistory.push({
          role: "user",
          content: question
        });

        chatHistory.push({
          role: "assistant",
          content: data.answer
        });

        chatHistory = chatHistory.slice(-80);

      } catch (err) {
        thinking.remove();

        addMessage(
          "bot",
          "Sorry, I could not connect right now. Please try again."
        );
      } finally {
        sending = false;
        button.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    document
      .getElementById("question")
      .addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
          sendMessage();
        }
      });
  </script>
</body>
</html>
